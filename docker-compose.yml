version: '3.8'
services:
  statserv:
    build: .
    container_name: statserv
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/statdb
    restart: always

  mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: statserv-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
